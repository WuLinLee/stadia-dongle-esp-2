name: Build & Release

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-firmware:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test USB configuration protocol
        run: npm test

      - name: Test rumble Gamma mapping profiles
        shell: bash
        run: |
          set -euo pipefail
          for profile in 0 1 2; do
            gcc -std=c11 -Wall -Wextra -Werror \
              -D STADIA_RUMBLE_PROFILE=$profile \
              -Imain main/rumble_map.c tests/test_rumble_map.c \
              -lm -o "/tmp/test-rumble-$profile"
            "/tmp/test-rumble-$profile"
          done

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32s3
          command: |
            set -euo pipefail
            for profile in reference gentle punch; do
              case "$profile" in
                reference) profile_id=0 ;;
                gentle) profile_id=1 ;;
                punch) profile_id=2 ;;
              esac
              idf.py -B "build-$profile" -D "STADIA_RUMBLE_PROFILE=$profile_id" build
              python -m esptool --chip esp32s3 merge_bin \
                --output "build-$profile/firmware-$profile-merged.bin" \
                --flash-mode dio --flash-size 4MB --flash-freq 80m \
                0x0 "build-$profile/bootloader/bootloader.bin" \
                0x8000 "build-$profile/partition_table/partition-table.bin" \
                0x20000 "build-$profile/stadia-dongle.bin"
            done
            mkdir -p firmware-output
            cp build-reference/firmware-reference-merged.bin firmware-output/firmware-reference-merged.bin
            cp build-gentle/firmware-gentle-merged.bin firmware-output/firmware-gentle-merged.bin
            cp build-punch/firmware-punch-merged.bin firmware-output/firmware-punch-merged.bin
            cp build-reference/firmware-reference-merged.bin firmware-output/firmware-merged.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware-output/*.bin
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build-firmware
    runs-on: ubuntu-latest
    if: ${{ needs.build-firmware.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: release

      - name: Set release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/tags/"* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: release/*.bin

  deploy-pages:
    name: Deploy web installer to GitHub Pages
    needs: build-firmware
    if: ${{ needs.build-firmware.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download freshly built firmware
        if: ${{ needs.build-firmware.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: docs/

      - name: Prepare USB configuration page
        run: |
          cp main/index.html docs/config.html
          cp main/webhid_transport.js docs/webhid_transport.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
